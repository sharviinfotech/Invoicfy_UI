<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <strong>Gate Entry Form</strong>

        <div class="d-flex align-items-center gap-2">
            <strong>Gate Entry No</strong>
            <input type="text" [(ngModel)]="gateSearchValue" placeholder="Enter Gate Entry No"
                class="form-control form-control-sm" style="width:140px;">
            <button class="btn btn-primary btn-sm" type="button" (click)="GetGateEntry()"
                style="height:35px;">GET</button>
        </div>
    </div>

    <div class="card-body">
        <form [formGroup]="gateEntryForm">

            <div class="row g-3"> <!-- g-3 gives equal gap everywhere -->

                <!-- ROW 1 -->
                <div class="col-md-4">
                    <label class="form-label">Entry Object Type *</label>
                    <input formControlName="EntryObjectType" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Vehicle Type *</label>
                    <input formControlName="VehicleType" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Vehicle Entry Date & Time *</label>
                    <input formControlName="VehicleEntrydatetime" class="form-control form-control-sm"
                        type="datetime-local">
                </div>

                <!-- ROW 2 -->
                <div class="col-md-4">
                    <label class="form-label">Vehicle Number *</label>
                    <input formControlName="VehicleNumber" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Driver Name *</label>
                    <input formControlName="DriverName" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Driver Contact No *</label>
                    <input formControlName="DriverContactNO" maxlength="10" class="form-control form-control-sm"
                        type="text">
                </div>

                <!-- ROW 3 -->
                <div class="col-md-4">
                    <label class="form-label">Driver ID *</label>
                    <input formControlName="DriverId" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">PO Number *</label>
                    <input formControlName="PO" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Product Code *</label>
                    <input formControlName="ProductCode" class="form-control form-control-sm" type="text">
                </div>

                <!-- ROW 4 -->
                <div class="col-md-4">
                    <label class="form-label">Product Name *</label>
                    <input formControlName="ProductName" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Quantity *</label>
                    <input formControlName="Quantity" class="form-control form-control-sm" type="number">
                </div>

                <div class="col-md-4">
                    <label class="form-label">UoM *</label>
                    <input formControlName="Uom" class="form-control form-control-sm" type="text">
                </div>

                <!-- ROW 5 -->
                <div class="col-md-4">
                    <label class="form-label">Gate Pass No *</label>
                    <input type="text" formControlName="GatePassNo" class="form-control form-control-sm" y>

                </div>

                <div class="col-md-4">
                    <label class="form-label">Visitor Type</label>
                    <input formControlName="visitorType" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Visitor Name</label>
                    <input formControlName="visitorName" class="form-control form-control-sm" type="text">
                </div>

                <!-- ROW 6 -->
                <div class="col-md-4">
                    <label class="form-label">Purpose of Visit</label>
                    <input formControlName="PurposeofVisit" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Employee Responsible *</label>
                    <input formControlName="EmployeResponsible" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">ID Type *</label>
                    <input formControlName="IdType" class="form-control form-control-sm" type="text">
                </div>

                <!-- IMAGE UPLOAD -->
                <div class="col-md-4">
                    <label class="form-label">
                        Image Capture <span *ngIf="!isUpdateMode">*</span>
                    </label>
                    <div class="d-flex flex-column align-items-start">
                        <input #fileInput type="file" accept="image/*" (change)="onImageSelect($event)"
                            class="form-control form-control-sm mb-2">
                        <!-- Removed the <img> preview -->
                    </div>
                </div>


                <!-- ROW 8 -->
                <div class="col-md-4">
                    <label class="form-label">Exit Date Time</label>
                    <input formControlName="ExitDateTime" class="form-control form-control-sm" type="datetime-local">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Item Code</label>
                    <input formControlName="ItemCode" class="form-control form-control-sm" type="text">
                </div>

                <!-- ROW 9 -->
                <div class="col-md-4">
                    <label class="form-label">Serial Number</label>
                    <input formControlName="SerialNumber" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Responsible Person</label>
                    <input formControlName="ResponsiblePerson" class="form-control form-control-sm" type="text">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Approver Name *</label>
                    <input formControlName="ApproverName" class="form-control form-control-sm" type="text">
                </div>

            </div>

            <div class="text-end mt-4">
                <button class="btn btn-success" type="button" (click)="SaveGateEntry()" *ngIf="!isUpdateMode">
                    Save
                </button>

                <button class="btn btn-warning" type="button" (click)="UpdateGateEntry()" *ngIf="isUpdateMode">
                    Update
                </button>
            </div>

        </form>
    </div>
</div>
