<div class="">
    <form [formGroup]="stockForm">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Stock Entry</span>
                <button type="button" class="btn bn-md btn-raised btnAdd" (click)="addRow()">
                    + Add Row
                </button>
            </div>
            <div class="card-body">
                <div formArrayName="items">
                    <table class="table table-bordered table-striped">
                        <thead class="table-light text-center">
                            <tr>
                                <th>#</th>
                                <th>Nature of Transaction</th>
                                <th>Company Name|plant</th>
                                <th>Posting Date</th>
                                <th>Product Code</th>
                                <th>Product Name</th>
                                <th>Material Type</th>
                                <th>S Lock</th>
                                <th>available Stock</th>
                                <th>Value</th>
                                <th>Batch</th>
                                <th>UOM</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
                                <td class="text-center">{{ i + 1 }}</td>
                                <!-- <td><input formControlName="sourceOfStock" class="form-control form-control-sm"
                                        placeholder="Code" /></td> -->
                                <td>
                                    <select formControlName="sourceOfStock" class="form-control form-control-sm">
                                        <option value="">Select Source</option>
                                        <option value="initial stock">Initial Stock</option>
                                        <option value="from production">From Production</option>
                                        <option value="from po">From PO</option>
                                    </select>
                                </td>

                                <!-- <td><input formControlName="companyNameORPlant" class="form-control form-control-sm"
                                        placeholder="Name" /></td> -->
                                <td>
                                    <select class="form-control form-control-sm" formControlName="companyNameORPlant"
                                        (change)="onCompanySelect(i)">
                                        <option value="">Select Company</option>
                                        <option *ngFor="let p of productList" [value]="p.companyNameORPlant">
                                            {{ p.companyNameORPlant }}
                                        </option>
                                    </select>
                                </td>

                                <td><input formControlName="postingDate" class="form-control form-control-sm"
                                        type="datetime-local" placeholder="Type" /></td>
                                <!-- <td><input formControlName="productCode" class="form-control form-control-sm"
                                        placeholder="Code" /></td> -->
                                <td><select class="form-control" (change)="onProductSelect(i, $event)">
                                        <option value="">Select Product</option>
                                        <ng-container *ngFor="let p of items.at(i)['filteredProducts']">
                                            <option [value]="p.productCode">{{ p.productName }}</option>
                                        </ng-container>
                                    </select>
                                </td>
                                <td><input formControlName="productName" class="form-control form-control-sm"
                                        placeholder="Name" /></td>
                                <td><input formControlName="materialType" class="form-control form-control-sm"
                                        placeholder="Type" /></td>
                                <td><input formControlName="sLock" class="form-control form-control-sm"
                                        placeholder="Type" /></td>
                                <td><input formControlName="availableStock" type="number"
                                        class="form-control form-control-sm" placeholder="Type" /></td>
                                <td><input formControlName="value" type="number" class="form-control form-control-sm"
                                        placeholder="Value" /></td>
                                <td><input formControlName="batch" class="form-control form-control-sm"
                                        placeholder="Batch" />
                                </td>
                                <td><input formControlName="uom" class="form-control form-control-sm"
                                        placeholder="UOM" />
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-danger" (click)="removeRow(i)">
                                        <i class="bx bx-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>



                    </table>
                </div>



                <div class="text-right">
                    <button type="button" class="btn btn-primary" (click)="saveStockEntry()">
                        <i class="bx bx-save"></i> Post Stock
                    </button>
                </div>
            </div>

        </div>

    </form>
</div>
